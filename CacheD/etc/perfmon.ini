

[PerfMon]

; Remaining options: code defaults. Shipping values are comments.
; Shipping: 1
; Enable performance-counter polling when nonzero. Availability of individual counters depends on
; the OS adapter.
CheckPerfMon=0
; Shipping: 1
; Enable process memory-usage reporting in the performance monitor when nonzero.
Memusage=0
; Shipping: 6000
; Performance-monitor sampling interval in milliseconds.
Interval=6000
; Shipping: 10
; CPU-usage threshold used by the performance monitor's process diagnostic report.
CPUIsolationLevel=10
; Shipping: 33
; Number of counters to load (Perf1 through PerfCount). 0 loads none. To add a counter, supply all
; three PerfN fields and raise Count.
Count=0
; Shipping: Processor
; Counter 1: performance object/category. Used only when CheckPerfMon is enabled and Count >= 1.
Perf1ObjectName=Processor
; Shipping: _Total
; Counter 1: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 1.
Perf1InstanceName=0
; Shipping: "% Processor Time"
; Counter 1: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 1.
Perf1CounterName=% Processor Time
; Shipping: Process
; Counter 2: performance object/category. Used only when CheckPerfMon is enabled and Count >= 2.
Perf2ObjectName=Processor
; Shipping: Cached
; Counter 2: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 2. The loader replaces this value with the current
; executable basename.
