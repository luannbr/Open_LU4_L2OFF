; Safe portable CacheD defaults. This is a runnable layout template, not the
; recovered NCSoft deployment file. Every network peer is loopback-only and
; SMTP remains disabled until configured by the operator.

[Logging]
; Portable operator diagnostics: 0=normal output, 1=include DEBUG.
; Applied after this INI loads. Does not enable accounting/packet payload dumps.
; Diagnostic verbosity: 0 omits DEBUG records, 1 includes them. Accounting records are unaffected.
Debug=0

[LogD]
; Shipping: 10.30.2.200
; IPv4 address of the peer named by this section. Loopback connects to the same machine.
address=127.0.0.1
; Shipping: 3999
; TCP port of the peer named by this section. Must match its listener.
port=3999
; Local log rotation interval in minutes. Use a positive divisor of 60 (for example 10, 15 or 30).
; Never use 0.
FileDuration=30

[World]
; Shipping: 200
; World/database identity exchanged with peer servers. Keep the related CacheD and L2Server/L2NPC
; IDs consistent.
WorldId=1
; Shipping: 1
; Enable the legacy account-deletion processing branch when nonzero. Affects persistent account
; data.
DeleteAccount=0

; Remaining options: code defaults. Shipping values are comments.
; Shipping-only entry: no matching reader/default in the current configuration owner.
; Pair=0

[SQL]
; Shipping: 200:-1:-3
; Colon-separated database route IDs. Include WorldId. -1 is community/BBS and -3 is the shared
; route. Each needs connStr(id) and schema(id).
DBList=1:-1:-3
; Shipping: 5000
; Slow-SQL diagnostic threshold in milliseconds. Does not cancel a query.
SQLExecLimit=5000
; Legacy world DB timeout in seconds. Currently loaded but the PostgreSQL statement timeout
; remains 0 (no timeout).
WorldDBTimeOut=60
; Shipping: 3600
; SQL wait-time diagnostic threshold in seconds. 0 disables the threshold.
WaitTimeoutCheckTime=0
; Shipping: 1
; Run legacy item cleanup during CacheD startup when nonzero. Changes stored data.
ItemClearOnStart=0
; Shipping: 1
; Enable saving the QsCheck diagnostic data when nonzero.
SaveQsData=0

; Remaining options: code defaults. Shipping values are comments.
; Shipping: 1
; Run legacy orphan/ghost-data cleanup during CacheD startup when nonzero. Changes stored data.
GhostDataClearOnStart=0
; Shipping-only entry: no matching reader/default in the current configuration owner.
; BBSDBTimeOut=60
; Shipping-only entry: no matching reader/default in the current configuration owner.
; writecache=1
; Shipping-only entry: no matching reader/default in the current configuration owner.
; USEBBS=1
; Shipping-only entry: no matching reader/default in the current configuration owner.
; Mysql=true

[Setting]
; Startup interface: console (default) or gui (Windows only).
UserInterface=console

; Shipping: test
; Server mode: dev, live, test, movie, broadcast or worldserver. L2Server and L2NPC must agree.
ServerType=test
; Numeric region code used by localization and regional gameplay/account policies. 0 selects
; Korea.
Country=0
; Shipping: 127.0.0.1
; Comma-separated administrator IPv4 addresses accepted by the matching administrative
; checks.
AdminIP=127.0.0.1
; Allow the portable SMTP transport only when MailServer and MailTo are usable. False
; prevents SMTP network I/O.
EnableSystemMail=false
; Shipping: smtp.game.ncsoft
; Optional legacy SMTP host. Absence keeps the legacy mail transport unconfigured. Empty is not
; equivalent to absence.
MailServer=disabled.invalid
; Optional recipient for legacy SMTP mail. Leave absent when legacy mail is unused.
MailTo=
; Read for compatibility, then forced to true by the current CacheD loader. SMTP still requires
; EnableSystemMail and explicit recipients.
UseServerStartMail=false
; Shipping: true
; Enable the legacy remote server-stop mechanism. Requires the matching ServerStopperKey.
ServerStopperEnabled=false
; Enable the legacy direct-command interface. Intended for controlled administration/debugging.
direct_command=false
; Enable the legacy write-cache behavior when nonzero.
writecache=1
; Shipping: 1
; Enable deferred persistence for the configured LateSavingItems instead of immediate saving on
; each change.
LateSaving=0
; Generate a crash dump when the crash handler runs. This does not prevent a crash.
minidump=true
; Numeric MINIDUMP_TYPE flags passed to the dump writer. Meaningful support depends on the
; platform.
minidump_type=1
; Shipping: EP3.0
; Human-readable build/content version included in diagnostics and server reports. Does not select
; protocol or scripts.
binary_update_version=portable

; Remaining options: code defaults. Shipping values are comments.
; Compatibility key read and discarded by the current CacheD loader. Changing it does not bypass a
; version check.
IgnoreInvalidServerCacheVersion=true
; Shipping: 0
; Positive values enable loading weekly account play time from the database. 0 disables it.
; This is an enable condition, not a duration in minutes or seconds.
timelimit=0
; Shipping: "5789.5790.1835.1463.1464.1465.1466.1467.2509.2510.2511.2512.2513.2514.3947.3948.3949.3950.3951.3952.6645.6646.17754.19441.19442.20332.6647.20333.20334.38153.38154.46082.46083"
; Semicolon-separated item class IDs eligible for deferred saving. Empty selects none.
LateSavingItems=
; Shipping: 10
; Amount threshold used by the deferred item-saving path.
LateSavingAmount=100
; Shipping: <deployment credential omitted>
; Numeric key checked by the legacy server-stop mechanism. Used only when that mechanism is
; enabled.
ServerStopperKey=0
; Show progress from legacy internal test cases. Use true/false. This does not run CTest.
ShowTestCaseProgress=false
; Legacy ODBC selection string. Literal false leaves it unselected. Portable DB connections are
; configured in cached-postgresql.ini.
MyOdbc=false
; Shipping: 1
; Character deletion waiting period in days for the matching deletion policy.
WaitingDateForDelete=7
; Character deletion waiting period in minutes for the short-delay deletion policy.
WaitingMinuteForDelete=60
; Shipping: true
; Enable the commission-item migration/move startup path. Affects persisted commission data.
MoveCommission=false
; Count threshold used by the character block-penalty policy.
BlockPenaltyCount=0
; Character level threshold used by the block-penalty policy.
BlockPenaltyLevel=0
; Minimum character level used by the post/mail restriction checks.
PostLimitLevel=0
; Daily training reset offset in seconds from local midnight. 23400 means 06:30 local time.
TrainingTimeInit=23400
; Daily available training time in minutes, replenished when the reset boundary is crossed.
TrainingTimeLimit=300
; Legacy development-mail host value. Does not override the portable SMTP network gate.
DevMailServer=dev-mail
; Shipping-only entry: no matching reader/default in the current configuration owner.
; ExceptionMailing=true
; Shipping-only entry: no matching reader/default in the current configuration owner.
; ExceptionMinidump=true

; Number of preallocated network I/O buffers, not bytes or connections. Increasing it raises
; startup memory use. This reader currently opens ./l2cache.ini in the working directory,
; of --config-dir. Set it in that runtime file to change the buffer pool.
IOBufferCount=65536
[Portable]
; The exact recovered validator remains available but is opt-in because a
; portable deployment does not use the original Windows serial-key service.
; Enable legacy serial-key/host validation during CacheD startup. False permits portable
; deployments without the shipping license service.
EnableSerialKeyValidation=false

[GIP]
; Shipping: false
; Enable the GIP monitoring connection. False leaves it disabled.
Enabled=false
; Shipping: 127.0.0.1
; IPv4 address of the peer named by this section. Loopback connects to the same machine.
Address=127.0.0.1
; Shipping: 30271
; TCP port of the peer named by this section. Must match its listener.
Port=3999
; Shipping: 10
; Peer heartbeat/reconnect interval in seconds. The service named by this section consumes it.
Heartbeat=10

[QsCheck]
; Shipping: true
; Enable the QsCheck statistics. False leaves it disabled.
Enabled=false
; Shipping: 55
; Minute within the hour at which QsCheck reports/resets its statistics. Used only when QsCheck is
; enabled.
ResetTime=55
; Shipping: true
; Collect statistics for packets received from L2Server by CacheD.
ServerToCacheDPacketStatMonitor=false
; Shipping: true
; Collect statistics for packets sent from CacheD to L2Server.
CacheDToServerPacketStatMonitor=false

[DBSecurity]
; Shipping: true
; Enable the legacy database-security policy and its configured penalty/key checks.
UseDBSecurity=false
; Shipping: 1
; Penalty level applied by the DBSecurity policy when enabled.
PenaltyLevel=0
; Shipping: <deployment credential omitted>
; DBSecurity key supplied to the legacy security checks. Not a PostgreSQL password.
Key=portable-disabled

[MyOdbc]
; Enable the legacy MyOdbc path. False leaves it disabled.
enabled=false

; Remaining options: code defaults. Shipping values are comments.
; Legacy MyOdbc world-database name. Portable PostgreSQL uses cached-postgresql.ini instead.
world_db=

[FreeToPlay]
; Shipping: 2
; Number of character slots that the account activation policy allows.
ActivateCharacterAmount=7
; Shipping: 85
; Character level threshold used by F2P character deactivation rules.
DeactivateMinLevel=200
; Shipping: 3
; Daily post limit for free accounts. -1 is the default unrestricted value.
DailyPostCountForFreeUser=-1
; Enable the dual free/premium billing policy.
DualBillingSystem=false

[ServerAutoStarter]
; Shipping: false
; Enable the automatic server-process launcher. False leaves it disabled.
Enabled=false
; Shipping: "D:\\L2Server\\L2Server"
; Working directory for the process launched by this auto-starter. Empty leaves it unspecified.
WorkingFolder=
; Shipping: "D:\\L2Server\\L2Server\\L2Server.exe"
; Executable or batch path launched by this auto-starter. Only used when Enabled is true.
FilePath=

[Paths]
; Optional deployment directories. Relative paths start beside this INI.
; Command-line --scripts-dir and --html-dir take precedence.
; Script root override. Empty keeps the legacy path. Relative paths start beside this INI.
; --scripts-dir takes precedence.
ScriptsDirectory=

; HTML root override. Empty keeps the legacy path. Relative paths start beside this INI.
; --html-dir wins. MultiLang selects html_LANGUAGE subdirectories inside this root.
HtmlDirectory=
; Geodata root override. Empty keeps the legacy path. Relative paths start beside this INI.
; --geo-dir takes precedence.
GeoDirectory=
