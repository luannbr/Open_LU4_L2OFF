; Portable PostgreSQL transport mapping for the supplied DBList=1:-1:-3.
; This file is a platform replacement for encrypted Windows registry/ODBC
; connection strings. It is not part of the original Cached.exe source.
;
; Copy to cached-postgresql.ini beside the working l2cache.ini and fill every
; connection/schema value. Do not commit passwords. The current world schema
; migration is named "world". Pool -1 is the current lin2comm/BBS route and
; uses the recovered "community" schema. Explicit lin2user calls map to the
; separate "account" schema. Migration 198 supplies the currently reached
; shared PCCafe coupon callables in the "shared" schema.

[PostgreSQL]
; Optional startup migrations, before SQL pools/listeners. Empty disables them.
; Relative paths start beside cached-postgresql.ini. The supplied directory is
; CacheD/sql. Deploy its migrations.order together with its SQL files.
; AuthD SQL migration directory, relative to this config file when not absolute. Missing or empty
; disables automatic migrations.
MigrationsDirectory="../sql"
; An optional MigrationsDirectory(<DBList id>) overrides this for that route.
; The common directory is applied once per physical database, not per schema.
; Missing per-route options inherit MigrationsDirectory. An explicit empty
; value disables migrations for that route, so these remain commented.
; Migration directory override for DBList route 1. Missing inherits MigrationsDirectory. Explicit
; empty disables migrations for this route.
; MigrationsDirectory(1)=
; Migration directory override for DBList route -1. Missing inherits MigrationsDirectory. Explicit
; empty disables migrations for this route.
; MigrationsDirectory(-1)=
; Migration directory override for DBList route -3. Missing inherits MigrationsDirectory. Explicit
; empty disables migrations for this route.
; MigrationsDirectory(-3)=

; Create a missing database before its migrations run. The connStr user needs the CREATEDB
; privilege. Missing or false requires an existing database.
CreateDatabase=true

; libpq connection string for DBList route 1. Mandatory when that route is enabled. Set
; deployment-specific credentials.
connStr(1)=host=127.0.0.1 port=5433 dbname=cached user=postgres password=CHANGE_ME
; Default PostgreSQL schema/search path for DBList route 1. Mandatory for an enabled route.
schema(1)=world

; libpq connection string for DBList route -1. Mandatory when that route is enabled. Set
; deployment-specific credentials.
connStr(-1)=host=127.0.0.1 port=5433 dbname=cached user=postgres password=CHANGE_ME
; Default PostgreSQL schema/search path for DBList route -1. Mandatory for an enabled route.
schema(-1)=community

; libpq connection string for DBList route -3. Mandatory when that route is enabled. Set
; deployment-specific credentials.
connStr(-3)=host=127.0.0.1 port=5433 dbname=cached user=postgres password=CHANGE_ME
; Default PostgreSQL schema/search path for DBList route -3. Mandatory for an enabled route.
schema(-3)=shared

; Optional mapping for explicit MSSQL three-part calls, for example
; lin2world.dbo.proc or lin2user.dbo.proc. Entries are separated by a semicolon.
; Semicolon-separated database=schema mappings for legacy qualified SQL names, for example
; lin2user=account, empty adds no explicit aliases.
database_schemas=lin2user=account;lin2comm=community

; Missing PostgreSQL functions use the recovered CannotFileSP.txt/SystemMail
; path. SMTP itself remains disabled unless l2cache.ini enables it
; and supplies both an explicit MailServer and MailTo list.
;
; The portable startup gate is controlled in l2cache.ini. It defaults to
; disabled. Setting it to true restores the shipping serial-key validation
; path without changing or removing the recovered validator:
;
; [Portable]
; EnableSerialKeyValidation=false
