; Shipping reference: this portable L2NPC has no perfmon.ini reader.
; Original options are kept commented. No defaults are invented.

[PerfMon]
; CheckPerfMon=1
; Memusage=1
; Interval=6000
; Count=2
; Perf1ObjectName=Processor
; Perf1InstanceName=_Total
; Perf1CounterName="% Processor Time"
; Perf2ObjectName=Process
; Perf2InstanceName=L2NPC
; Perf2CounterName="% Processor Time"
