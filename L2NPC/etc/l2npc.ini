; l2npc.ini  -  portable config for the reconstructed L2NPC (AI/NPC server).
; Includes the current CConfig/NPCServer readers and shipping reference keys.

[server]
; The one full-duplex CServerSocket. L2NPC connects out, then receives all
; L2Server callbacks over this same connection.
; Shipping: 10.30.1.200
; IPv4 address of the peer named by this section. Loopback connects to the same machine.
address=127.0.0.1
; Shipping: 2002
; TCP port of the peer named by this section. Must match its listener.
port=2002

[CacheD]
; The second outbound full-duplex socket used by CDBNPC/CDBNPCSocket.
; Shipping: 10.30.2.200
; IPv4 address of the peer named by this section. Loopback connects to the same machine.
address=127.0.0.1
; Shipping: 12008
; TCP port of the peer named by this section. Must match its listener.
port=12008

[Setting]
; Shipping: test
; Server mode: dev, live, test, movie, broadcast or worldserver. L2Server and L2NPC must agree.
server_type=test

; Shipping: 0
; Preset lottery reward amount loaded by the lottery manager. 0 adds no preset reward.
LottoPresetReward=0
; Must match [Setting]/server_type in L2Server's configuration.
; On POSIX, L2NPC_WINDOWS_ACP selects the ANSI code page used by the original
; WideCharToMultiByte(CP_ACP) boundaries. It defaults to 949 for Country=0.
; set it to the ACP of the Windows deployment being replaced (for example
; 1252, 1251, 932, 949, 950, or 65001).
; Portable safety boundary. SMTP remains completely disabled unless this is
; true AND both MailServer and MailTo are supplied below. Never
; point these at NCSoft infrastructure when running a recovered server.
; Allow the portable SMTP transport only when MailServer and MailTo are usable. False
; prevents SMTP network I/O.
EnableSystemMail=false
; These active sentinels are also rejected by the portable startup gate. Thus
; accidentally changing only EnableSystemMail cannot perform DNS or SMTP I/O.
; Shipping: smtp.game.ncsoft
; Optional legacy SMTP host. Absence keeps the legacy mail transport unconfigured. Empty is not
; equivalent to absence.
MailServer=disabled.invalid
; Optional recipient for legacy SMTP mail. Leave absent when legacy mail is unused.
MailTo=disabled@example.invalid
; Select the NPC chase-penalty behavior. 0 leaves that penalty disabled.
ChasePenalty=0
; NPC chase counter threshold consumed by AI chase handling. 0 is the code default.
MaxChaseCount=0
; Use the free/open-server gameplay branch. Affects rules that distinguish free access from paid
; service.
FreeOpenServer=false
; Shipping: true
; Enable the fast NPC entry-into-world path. Keep compatible with the L2Server startup mode.
FastEnterworld=true
; Shipping: "sat 19"
; Weekly lottery announcement schedule in the legacy 'day hour' format, for example sat 19. Uses
; server local time.
LottoAnnounce=sat 19
; Numeric region code used by localization and regional gameplay/account policies. 0 selects
; Korea.
Country=0
; Original [Setting] defaults.
; Standalone portable startup does not require the external resource loader.
; Shipping: true
; Enable the original resource-loader mode. L2Server/L2NPC must use a compatible startup
; arrangement. Ordinary standalone portable startup uses false.
UseResourceLoader=false
; Legacy reference key with no reader in the current L2NPC startup path. AI loading uses the
; script resources selected by Paths/ScriptsDirectory.
AiObj=ai.obj
; NPC spawn script filename under the selected script root. If absent: npcpos_world.txt in
; worldserver mode, otherwise npcpos.txt.
NpcPosFile=npcpos.txt

; Remaining options: code defaults. Shipping values are comments.
; Request a server-start notification through SystemMail. Delivery still depends on the SMTP gate
; and recipients.
UseServerStartMail=false
; Shipping: EP3.0
; Human-readable build/content version included in diagnostics and server reports. Does not select
; protocol or scripts.
binary_update_version=Please insert a chaotic throne version!
; Emit NPC spawn diagnostics. Can produce substantial output with production spawn data.
SpawnLog=false
; Non-PK world flag. In L2NPC it also disables the lottery when true. It is not merely a
; combat-log switch.
isnonpk=false
; Enables script debug messages as DEBUG in the console and local system log.
; These debug records are not forwarded to LogD.
; Emit AI script debug messages as local DEBUG records. These messages are not forwarded to LogD.
ScriptDebugLog=false
; Enable legacy in-process test-case hooks where reached. Unrelated to CMake BUILD_TESTING or
; CTest.
RunTestCase=true
; Shipping: false
; Apply BossRespawnFactor to boss respawn scheduling.
BossRespawnFactorEnabled=false
; Shipping: 0
; Percentage adjustment to boss respawn timing when enabled. Values below -99 are rejected and
; replaced with 0.
BossRespawnFactor=0
; Show progress from legacy internal test cases. Use true/false. This does not run CTest.
ShowTestCaseProgress=false
; Enable tracing of NPC AI execution for diagnostics. Potentially high-volume output.
TraceNpcAI=false
; Enable tracing of global-object AI execution for diagnostics.
TraceGlobalObjectAI=false
; Enable the legacy direct-command interface. Intended for controlled administration/debugging.
direct_command=false
; Shipping: true
; Enable NPC event-count reporting for runtime diagnostics.
ReportNPCEventCount=false
; Enable checks of AI timer additions. Uses AddTimerCheckCount as the threshold.
AddTimerCheck=false
; Threshold used by AddTimerCheck when counting timer additions. Not a duration.
AddTimerCheckCount=10000
; Quest reward multiplier as a percentage for configured F2P penalty quests. 100 means unchanged,
; minimum accepted value is 1.
F2PQuestRewardPenaltyPer=100
; Semicolon-separated quest IDs subject to the F2P quest reward multiplier. Empty selects none.
F2PRewardPenaltyQuests=
; Price of one lottery ticket in adena.
LottoTicketPrice=2000
; Minimum lottery winner payout. -1 keeps the legacy no-explicit-minimum setting.
LottoMinimumWinnerPrice=-1
; World ID used for the raid-server role. -1 means no configured raid server.
RaidServerId=-1
; Shipping-only entry: no matching reader/default in the current configuration owner.
; ExceptionMailing=true
; Shipping-only entry: no matching reader/default in the current configuration owner.
; ExceptionMinidump=true
; Event-server mode value consumed by L2NPC startup. 0 is the code default.
IsEventServer=0

; Number of preallocated network I/O buffers, not bytes or connections. Increasing it raises
; startup memory use.
IOBufferCount=2048
[World]
; Shipping: 200
; World/database identity exchanged with peer servers. Keep the related CacheD and L2Server/L2NPC
; IDs consistent.
WorldId=1

[Debug]
; NPC timer-count warning threshold. 0 disables warnings. This is a number of timers, not
; milliseconds.
TimerOverflowLimit=0
; While a NPC exceeds TimerOverflowLimit, report every N timer callbacks. Nonpositive values
; suppress reporting.
TimerOverflowCheckTick=90

[SharedMemory]
; Original CCreatureFactory mappings. POSIX adapters open the same names
; with a leading slash. Environment overrides:
; L2NPC_CREATURE_DATA_SHM / L2NPC_CREATURE_INDEX_SHM.
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
CreatureData=L2World_CreatureData
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
CreatureIndex=L2World_CreatureIndex
; SharedUserMapDensity::CanAct consumes this exact 87,040-dword map.
; Current runtime uses the fixed UserMapDensity mapping, not an INI/env override.
; Legacy reference key: current SharedUserMapDensity::Init uses the fixed UserMapDensity mapping.
; this INI entry is not read.
UserMapDensity=UserMapDensity
; Original Windows name is L2World_StaticObjectData. On POSIX the portable
; adapter opens /L2World_StaticObjectData with shm_open. The environment
; variable L2NPC_STATIC_OBJECT_SHM overrides this value.
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
StaticObjectData=L2World_StaticObjectData
; Original CSharedItemFactory mapping. L2NPC_ITEM_SHM overrides it.
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
ItemData=L2World_ItemData

; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
PartyData=L2World_PartyData
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
PartyIndex=L2World_PartyIndex
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
PledgeData=L2World_PledgeData
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
PledgeIndex=L2World_PledgeIndex
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
AllianceData=L2World_AllianceData
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
AllianceIndex=L2World_AllianceIndex
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
GeneralObjectData=L2World_GeneralObjectData
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
GeneralObjectIndex=L2World_GeneralObjectIndex
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
AirShipData=L2World_AirShipData
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
AirShipConstant=L2World_AirShipConstant
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
AirShipIndex=L2World_AirShipIndex
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
StaticObjectIndex=L2World_StaticObjectIndex
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
ItemConstant=L2World_ItemConstant
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
ItemIndex=L2World_ItemIndex
; Shared-memory mapping name. Must match the L2Server producer. The matching L2NPC_*_SHM
; environment override takes precedence.
GeoDataIndex=L2World_GeoDataIndex
; Shared-memory mapping base name. The adapter adds zone suffixes. Must match the L2Server
; producer. The matching L2NPC_*_SHM environment override takes precedence.
GeoDataZones=L2World_GeoDataZones
; Shared-memory mapping base name. The adapter adds zone suffixes. Must match the L2Server
; producer. The matching L2NPC_*_SHM environment override takes precedence.
GeoDataCells=L2World_GeoDataCells
; Shared-memory mapping base name. The adapter adds zone suffixes. Must match the L2Server
; producer. The matching L2NPC_*_SHM environment override takes precedence.
GeoDataCellOffest=L2World_GeoDataCellOffest
[map]
; Shipping: map
; Legacy reference key: NPCServer reads [map]/directory from a separate working-directory file
; named map, not from this INI.
directory=map

[GeoData]
; Original CGeoData::Load reads ..\GeoData\geo_index.txt.
; Current runtime consumes L2Server geodata mappings. This legacy key is not read.
; Legacy reference key: the current L2NPC consumes geodata shared memory produced by L2Server. Use
; Paths/GeoDirectory for the supported path override.
directory=../../../../../GeoData

[LogD]
; Shipping: 10.30.2.200
; IPv4 address of the peer named by this section. Loopback connects to the same machine.
address=127.0.0.1
; Shipping: 3999
; TCP port of the peer named by this section. Must match its listener.
port=3999
; Local log rotation interval in minutes. Use a positive divisor of 60 (for example 10, 15 or 30).
; Never use 0.
FileDuration=30
; Retained historical directory entry. The current log setup does not read it.
; Legacy reference key with no reader in the current NPCServer log setup. It does not relocate the
; log directory.
directory=log

[Paths]
; Optional deployment directories. Relative paths start beside this INI.
; Command-line --scripts-dir and --geo-dir take precedence.
; Script root override. Empty keeps the legacy path. Relative paths start beside this INI.
; --scripts-dir takes precedence.
ScriptsDirectory=
; Geodata root override. Empty keeps the legacy path. Relative paths start beside this INI.
; --geo-dir takes precedence.
GeoDirectory=

; HTML root override. Empty keeps the legacy path. Relative paths start beside this INI.
; --html-dir wins. MultiLang selects html_LANGUAGE subdirectories inside this root.
HtmlDirectory=
[db]

; Remaining options: code defaults. Shipping values are comments.
; Legacy NPCServer database username field. Current portable L2NPC reaches persistence through
; CacheD, not a direct PostgreSQL login.
user=
; Legacy NPCServer database password field. Current portable L2NPC uses CacheD for persistence.
password=
