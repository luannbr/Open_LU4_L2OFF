; L2Server's nine shipped counters. Loaded from --config-dir when supplied.

[PerfMon]
; Shipping: 1
; Enable performance-counter polling when nonzero. Availability of individual counters depends on
; the OS adapter.
CheckPerfMon=1
; Shipping: 1
; Enable process memory-usage reporting in the performance monitor when nonzero.
Memusage=1
; Shipping: 6000
; Performance-monitor sampling interval in milliseconds.
Interval=6000
; Shipping: 10
; CPU-usage threshold used by the performance monitor's process diagnostic report.
CPUIsolationLevel=30

; Shipping: 9
; Number of counters to load (Perf1 through PerfCount). 0 loads none. To add a counter, supply all
; three PerfN fields and raise Count.
Count=9
; Shipping: Processor
; Counter 1: performance object/category. Used only when CheckPerfMon is enabled and Count >= 1.
Perf1ObjectName=Processor
; Shipping: _Total
; Counter 1: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 1.
Perf1InstanceName=_Total
; Shipping: "% Processor Time"
; Counter 1: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 1.
Perf1CounterName=% Processor Time

; Shipping: Process
; Counter 2: performance object/category. Used only when CheckPerfMon is enabled and Count >= 2.
Perf2ObjectName=Process
; Shipping: L2Server
; Counter 2: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 2. The loader replaces this value with the current
; executable basename.
Perf2InstanceName=L2Server
; Shipping: "% Processor Time"
; Counter 2: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 2.
Perf2CounterName=% Processor Time

; Shipping: Process
; Counter 3: performance object/category. Used only when CheckPerfMon is enabled and Count >= 3.
Perf3ObjectName=Process
; Shipping: L2NPC
; Counter 3: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 3.
Perf3InstanceName=L2NPC
; Shipping: "% Processor Time"
; Counter 3: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 3.
Perf3CounterName=% Processor Time

; Shipping: Memory
; Counter 4: performance object/category. Used only when CheckPerfMon is enabled and Count >= 4.
Perf4ObjectName=Memory
; Shipping: ""
; Counter 4: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 4.
Perf4InstanceName=
; Shipping: "Page Faults/sec"
; Counter 4: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 4.
Perf4CounterName=Page Faults/sec

; Shipping: Memory
; Counter 5: performance object/category. Used only when CheckPerfMon is enabled and Count >= 5.
Perf5ObjectName=Memory
; Shipping: ""
; Counter 5: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 5.
Perf5InstanceName=
; Shipping: Pages/sec
; Counter 5: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 5.
Perf5CounterName=Pages/sec

; Shipping: Process
; Counter 6: performance object/category. Used only when CheckPerfMon is enabled and Count >= 6.
Perf6ObjectName=Process
; Shipping: L2Server
; Counter 6: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 6.
Perf6InstanceName=L2Server
; Shipping: "Page Faults/sec"
; Counter 6: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 6.
Perf6CounterName=Page Faults/sec

; Shipping: PhysicalDisk
; Counter 7: performance object/category. Used only when CheckPerfMon is enabled and Count >= 7.
Perf7ObjectName=PhysicalDisk
; Shipping: _Total
; Counter 7: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 7.
Perf7InstanceName=_Total
; Shipping: "Avg. Disk Queue Length"
; Counter 7: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 7.
Perf7CounterName=Avg. Disk Queue Length

; Shipping: PhysicalDisk
; Counter 8: performance object/category. Used only when CheckPerfMon is enabled and Count >= 8.
Perf8ObjectName=PhysicalDisk
; Shipping: _Total
; Counter 8: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 8.
Perf8InstanceName=_Total
; Shipping: "Avg. Disk sec/Read"
; Counter 8: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 8.
Perf8CounterName=Avg. Disk sec/Read

; Shipping: PhysicalDisk
; Counter 9: performance object/category. Used only when CheckPerfMon is enabled and Count >= 9.
Perf9ObjectName=PhysicalDisk
; Shipping: _Total
; Counter 9: object instance (for example _Total or a process basename). Used only when
; CheckPerfMon is enabled and Count >= 9.
Perf9InstanceName=_Total
; Shipping: "Avg. Disk sec/Write"
; Counter 9: counter within the selected object. Used only when CheckPerfMon is enabled and Count
; >= 9.
Perf9CounterName=Avg. Disk sec/Write
