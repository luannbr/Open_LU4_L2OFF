; External NCGuard provider configuration reference.
; Only update/ncgsdllver is read by the portable Windows loader.
; The commented options below belong to the external provider, not this server.
; Their meanings/defaults depend on that provider. They are not portable defaults.
; L2Server Setting/Ncguard remains disabled in the local configuration.

[update]
; gameid=2
; countryid=410
; Required Windows NCGuard provider DLL file version. Loader rejects a mismatch. Code default is
; 9999.9.9.1. Used only with an external provider.
ncgsdllver=9999.9.9.1
; pfpath=".\\patterns"
; pattern=".\\patterns\\pattern.pf"
; cipattern=".\\patterns\\cipattern.cip"
; mobilepattern=".\\patterns\\nmpattern.nm"
; fragmentsize=4096
; update_timer=20
; update_users=64

[timer]
; timer_period=1000
; scan_period=7200
; scan_duetime=300

[log]
; log_enable=1
; packet_log_enable=0
; logpath=".\\log\\ncguard_log"
; statistics_timer=900
; check_delay_ack=0

[moduleflag_withserver]
; cryptopacket=1
; uploadfile=0
; alluser_topwindow=0
; randomprotocol=1
; compareip=0

[compareip]
; time_lastlogout_range=60

[upload]
; uploadfilethreadcnt=5
; uploadfileopt=16
; uploadmaxsize=20
; uploadtimer=60
; uploadfilepath=".\\uploadfile\\"

[moduleflag_option]
; clientlog=1
; driver=0
; topwindow=1
; checkexceptionhandler=1
; zerosize=0
; packedfile=0
; windowname=1

[suspicious]
; botuser=0
; botguid=0
; botuserlist=".\\patterns\\botuserlist.xml"
; botguidlist=".\\patterns\\botguidlist.xml"

[MALWARE_STARTSCAN]
; use=1

[MALWARE_SCHEDULE]
; use=1
; start_hour=15
; start_min=00
; timer=60
; users=100

[PD_STARTSCAN]
